<script>
/* Switch to Arabic before the page draws, if the visitor chose it */
try { if (/[?&]lang=ar/.test(location.search) || (!/[?&]lang=en/.test(location.search) && localStorage.getItem("site-lang") === "ar")) {
  var h = document.documentElement; h.lang = "ar"; h.dir = "rtl"; h.classList.add("i18n-pending");
  setTimeout(function () { h.classList.remove("i18n-pending"); }, 1500);
} } catch (e) {}
